<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniCast Studio</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-group">
      <h1 class="brand">OmniCast <span class="badge-rev">rev1</span></h1>
      <span id="health-pill" class="pill pill-muted">接続確認中...</span>
    </div>

    <div class="project-bar">
      <select id="project-select" aria-label="プロジェクト選択"></select>
      <button id="btn-new-project" class="btn btn-secondary" type="button">+ 新規</button>
      <button id="btn-delete-project" class="btn btn-danger-outline" type="button" title="現在のプロジェクトを削除">削除</button>
    </div>

    <div class="action-bar">
      <button id="btn-open-import" class="btn btn-secondary" type="button">📥 台本インポート</button>
      <button id="btn-export-script" class="btn btn-secondary" type="button">📝 台本保存</button>
      <button id="btn-generate-all" class="btn btn-primary" type="button" title="ロックされていないすべてのセリフを生成・再生成します">⚡ 一括 Generate</button>
      <button id="btn-play-all" class="btn btn-accent" type="button">▶ 通し PLAY</button>
      <button id="btn-stop-all" class="btn btn-secondary hidden" type="button">⏹ 停止</button>
      <div class="export-group">
        <button id="btn-export-wav" class="btn btn-secondary" type="button">💾 WAV</button>
        <button id="btn-export-mp3" class="btn btn-secondary" type="button">💾 MP3</button>
      </div>
    </div>
  </header>

  <section id="project-settings" class="settings-bar hidden">
    <label class="field-inline">
      <span>タイトル</span>
      <input id="setting-title" type="text" />
    </label>
    <label class="field-inline">
      <span>既定言語</span>
      <select id="setting-lang">
        <option value="Auto">Auto</option>
        <option value="Japanese">Japanese</option>
        <option value="English">English</option>
        <option value="Chinese">Chinese</option>
        <option value="Korean">Korean</option>
      </select>
    </label>
    <label class="field-inline">
      <span>既定の間(秒)</span>
      <input id="setting-turn-pause" type="number" step="0.05" min="0" max="10" />
    </label>
    <label class="checkbox-inline">
      <input id="setting-trim" type="checkbox" />
      <span>前後無音トリム</span>
    </label>
    <label class="checkbox-inline">
      <input id="setting-norm" type="checkbox" />
      <span>音量均一化</span>
    </label>
    <span id="status-message" class="status-text"></span>
  </section>

  <main class="container">
    <div id="empty-state" class="empty-state hidden">
      <h2>OmniCast Studio へようこそ</h2>
      <p>デフォルトキャラクター（Alice / Bob / Carol / Dave / Narrator）を使って、台本から音声を作成できます。</p>
      <div class="empty-actions">
        <button id="btn-create-sample" class="btn btn-primary" type="button">サンプル台本でプロジェクトを作成</button>
        <button id="btn-create-blank" class="btn btn-secondary" type="button">空のプロジェクトを作成</button>
      </div>
    </div>

    <div id="blocks-container" class="blocks-list"></div>

    <div id="bottom-add-wrap" class="bottom-add hidden">
      <button id="btn-add-block-end" class="btn btn-secondary" type="button">+ 末尾にセリフを追加</button>
    </div>
  </main>

  <dialog id="import-dialog" class="modal">
    <form method="dialog" class="modal-card">
      <div class="modal-header">
        <h3>台本インポート（@Name: text）</h3>
        <button id="btn-close-import" class="btn-icon" type="button">✕</button>
      </div>
      <p class="modal-help">
        使用可能キャラ: <code>Alice</code>, <code>Bob</code>, <code>Carol</code>, <code>Dave</code>, <code>Narrator</code>（<code>#</code> 始まりはコメント）
      </p>
      <textarea id="import-textarea" rows="12" placeholder="@Alice: こんにちは、OmniCastへようこそ！&#10;@Bob: よろしくお願いします。今日もいい天気ですね。"></textarea>
      <div class="modal-options">
        <label><input type="radio" name="import-mode" value="replace" checked /> 現在の台本を置き換える</label>
        <label><input type="radio" name="import-mode" value="append" /> 末尾に追加する</label>
      </div>
      <div id="import-warnings" class="warning-box hidden"></div>
      <div class="modal-footer">
        <button id="btn-fill-sample" class="btn btn-secondary" type="button">サンプルを挿入</button>
        <button id="btn-confirm-import" class="btn btn-primary" type="button">インポート実行</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
